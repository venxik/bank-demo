spring:
  datasource:
    url: jdbc:h2:mem:bankdemo
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # Liquibase owns the schema now (db/changelog) — Hibernate only checks
      # entities match it at startup, never mutates it. See Liquibase primer,
      # Consolidated_Prep §10.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
